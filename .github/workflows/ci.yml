name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Import smoke check
        run: |
          python -c "import amc_showtime_alert.telegram, run_alert_pipeline; print('imports OK')"

      - name: Byte-compile all sources
        run: python -m compileall amc_showtime_alert run_alert_pipeline.py

      - name: Run unit tests
        # These suites are hermetic (tempfile DBs, no network or bot token).
        # The scraper/end-to-end notifier tests are excluded as they require
        # live AMC access and a Telegram token.
        run: python -m unittest -v test.test_custom_alerts test.test_format_parsing test.test_seat_map test.test_seat_alerts test.test_seat_render
